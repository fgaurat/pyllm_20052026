<svg viewBox="0 0 580 205" xmlns="http://www.w3.org/2000/svg" width="580" height="205" font-family="-apple-system,BlinkMacSystemFont,sans-serif">
  <rect width="580" height="205" rx="8" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="290" y="17" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Chunking avec overlap — préserver le contexte aux frontières</text>

  <!-- Document source strip -->
  <text x="14" y="36" font-size="9.5" font-weight="bold" fill="#374151">Document source (texte continu)</text>
  <rect x="14" y="42" width="552" height="22" rx="3" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="22" y="57" font-size="8" fill="#374151">… Chain-Ladder s'applique aux triangles de développement.</text>
  <text x="257" y="57" font-size="8" fill="#5B21B6" font-weight="bold"> Le Best Estimate résulte de l'agrégation</text>
  <text x="484" y="57" font-size="8" fill="#374151"> des flux …</text>

  <!-- WITH overlap section -->
  <text x="14" y="82" font-size="9" font-weight="bold" fill="#059669">Avec overlap (recommandé)</text>

  <!-- Chunk 1 -->
  <rect x="14" y="88" width="270" height="36" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="22" y="101" font-size="8.5" fill="#1E40AF" font-weight="bold">Chunk 1</text>
  <text x="22" y="116" font-size="8" fill="#374151">… Chain-Ladder s'applique aux triangles de développement.</text>

  <!-- Overlap zone -->
  <rect x="220" y="88" width="115" height="36" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.85"/>
  <text x="277" y="100" text-anchor="middle" font-size="8" fill="#5B21B6" font-weight="bold">overlap ≈ 50–100 tokens</text>
  <text x="277" y="113" text-anchor="middle" font-size="7.5" fill="#7C3AED">répétés dans les deux chunks</text>

  <!-- Chunk 2 -->
  <rect x="270" y="88" width="276" height="36" rx="5" fill="#F0FDF4" stroke="#059669" stroke-width="2"/>
  <text x="278" y="101" font-size="8.5" fill="#065F46" font-weight="bold">Chunk 2</text>
  <text x="278" y="116" font-size="8" fill="#374151">triangles de développement. Le Best Estimate résulte de l'agrégation…</text>

  <!-- Arrow to Chunk 3 -->
  <text x="510" y="145" font-size="8" fill="#D97706">Chunk 3…</text>
  <line x1="475" y1="106" x2="510" y2="130" stroke="#D97706" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- WITHOUT overlap section -->
  <text x="14" y="148" font-size="9" font-weight="bold" fill="#DC2626">Sans overlap (déconseillé)</text>

  <rect x="14" y="154" width="265" height="36" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="22" y="167" font-size="8.5" fill="#991B1B">Chunk 1 : « …triangles de »</text>
  <text x="22" y="180" font-size="8" fill="#6B7280">Coupure en plein milieu — le contexte est perdu</text>

  <rect x="286" y="154" width="280" height="36" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="294" y="167" font-size="8.5" fill="#991B1B">Chunk 2 : « développement. Le Best Estimate… »</text>
  <text x="294" y="180" font-size="8" fill="#6B7280">coupure nette → contexte perdu pour le LLM</text>
</svg>
