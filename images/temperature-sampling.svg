<svg viewBox="0 0 560 210" xmlns="http://www.w3.org/2000/svg" width="560" height="210" font-family="-apple-system,BlinkMacSystemFont,sans-serif">
  <rect width="560" height="210" rx="8" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="280" y="17" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Effet de la température sur la distribution de probabilité des tokens</text>

  <!-- LEFT panel: T=0.2 -->
  <rect x="10" y="28" width="258" height="172" rx="6" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="139" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">Température = 0,2</text>
  <text x="139" y="58" text-anchor="middle" font-size="8.5" fill="#6B7280">extraction structurée · comportement quasi-déterministe</text>

  <!-- Baseline -->
  <line x1="75" y1="155" x2="258" y2="155" stroke="#E5E7EB" stroke-width="1"/>

  <!-- T=0.2 — very peaked bars -->
  <text x="28" y="87" text-anchor="end" font-size="8.5" fill="#374151">78 %</text>
  <rect x="30" y="77" width="142" height="16" rx="2" fill="#1D4ED8"/>
  <text x="176" y="89" font-size="8.5" fill="#374151" dx="4">sinistres</text>

  <text x="28" y="109" text-anchor="end" font-size="8.5" fill="#374151">14 %</text>
  <rect x="30" y="99" width="26" height="16" rx="2" fill="#3B82F6"/>
  <text x="60" y="111" font-size="8.5" fill="#374151" dx="2">accidents</text>

  <text x="28" y="131" text-anchor="end" font-size="8.5" fill="#374151">5 %</text>
  <rect x="30" y="121" width="10" height="16" rx="2" fill="#93C5FD"/>
  <text x="44" y="133" font-size="8.5" fill="#374151" dx="2">incidents</text>

  <text x="28" y="153" text-anchor="end" font-size="8.5" fill="#374151">3 %</text>
  <rect x="30" y="143" width="5" height="16" rx="2" fill="#BFDBFE"/>
  <text x="39" y="155" font-size="8.5" fill="#9CA3AF" dx="2">dommages…</text>

  <rect x="18" y="163" width="240" height="28" rx="4" fill="#EFF6FF"/>
  <text x="138" y="173" text-anchor="middle" font-size="9" fill="#2563EB">→ choix quasi-certain : « sinistres »</text>
  <text x="138" y="185" text-anchor="middle" font-size="8.5" fill="#6B7280">Usage : JSON, extraction, classification</text>

  <!-- RIGHT panel: T=1.5 -->
  <rect x="292" y="28" width="258" height="172" rx="6" fill="white" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="421" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97706">Température = 1,5</text>
  <text x="421" y="58" text-anchor="middle" font-size="8.5" fill="#6B7280">génération créative · distribution aplatie</text>

  <!-- Baseline -->
  <line x1="357" y1="155" x2="540" y2="155" stroke="#E5E7EB" stroke-width="1"/>

  <!-- T=1.5 — flat bars -->
  <text x="310" y="87" text-anchor="end" font-size="8.5" fill="#374151">31 %</text>
  <rect x="312" y="77" width="57" height="16" rx="2" fill="#D97706"/>
  <text x="373" y="89" font-size="8.5" fill="#374151" dx="4">sinistres</text>

  <text x="310" y="109" text-anchor="end" font-size="8.5" fill="#374151">26 %</text>
  <rect x="312" y="99" width="48" height="16" rx="2" fill="#F59E0B"/>
  <text x="364" y="111" font-size="8.5" fill="#374151" dx="2">accidents</text>

  <text x="310" y="131" text-anchor="end" font-size="8.5" fill="#374151">22 %</text>
  <rect x="312" y="121" width="40" height="16" rx="2" fill="#FCD34D"/>
  <text x="356" y="133" font-size="8.5" fill="#374151" dx="2">incidents</text>

  <text x="310" y="153" text-anchor="end" font-size="8.5" fill="#374151">21 %</text>
  <rect x="312" y="143" width="38" height="16" rx="2" fill="#FDE68A"/>
  <text x="354" y="155" font-size="8.5" fill="#374151" dx="2">dommages</text>

  <rect x="300" y="163" width="240" height="28" rx="4" fill="#FEF9C3"/>
  <text x="420" y="173" text-anchor="middle" font-size="9" fill="#D97706">→ n'importe quel token peut être choisi</text>
  <text x="420" y="185" text-anchor="middle" font-size="8.5" fill="#6B7280">Usage : narratifs, commentaires, résumés créatifs</text>
</svg>
