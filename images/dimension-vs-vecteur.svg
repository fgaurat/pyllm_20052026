<svg viewBox="0 0 550 240" xmlns="http://www.w3.org/2000/svg" width="550" height="240" font-family="-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <marker id="arr_d" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#1E40AF"/></marker>
    <marker id="arr_v" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#92400E"/></marker>
    <marker id="arr_l" markerWidth="6" markerHeight="5" refX="1" refY="2.5" orient="auto"><polygon points="6 0,0 2.5,6 5" fill="#6B7280"/></marker>
    <marker id="arr_r" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#6B7280"/></marker>
  </defs>

  <rect width="550" height="240" rx="8" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="255" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Dimension et vecteur — l'analogie tableau</text>

  <!-- Annotation colonne (dimension) -->
  <text x="296" y="29" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">une dimension</text>
  <line x1="296" y1="32" x2="296" y2="45" stroke="#1E40AF" stroke-width="1.5" marker-end="url(#arr_d)"/>

  <!-- ===== TABLE ===== -->
  <!-- Coordonnées: x_label=10 w=68 | x0=78 x1=165 x2=252 x3=339 x4=426 w_col=87 w_dots=46 -->
  <!-- y_header=47 h=28 | y0=75 y1=112 y2=149 h_row=37 | bottom=186 -->

  <!-- HEADER ROW -->
  <!-- label vide -->
  <rect x="10" y="47" width="68" height="28" fill="#F3F4F6" stroke="#E5E7EB"/>
  <!-- sinistre -->
  <rect x="78" y="47" width="87" height="28" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="121" y="65" text-anchor="middle" font-size="9" font-weight="bold" fill="#374151">sinistre</text>
  <!-- chat -->
  <rect x="165" y="47" width="87" height="28" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="208" y="65" text-anchor="middle" font-size="9" font-weight="bold" fill="#374151">chat</text>
  <!-- provision — colonne surlignée -->
  <rect x="252" y="47" width="87" height="28" fill="#1E40AF" stroke="#1E40AF"/>
  <text x="295" y="65" text-anchor="middle" font-size="9" font-weight="bold" fill="white">provision</text>
  <!-- IBNR -->
  <rect x="339" y="47" width="87" height="28" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="382" y="65" text-anchor="middle" font-size="9" font-weight="bold" fill="#374151">IBNR</text>
  <!-- dots -->
  <rect x="426" y="47" width="46" height="28" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="449" y="65" text-anchor="middle" font-size="11" fill="#9CA3AF">···</text>

  <!-- ROW 0: Doc 1 — ligne surlignée amber -->
  <rect x="10" y="75" width="68" height="37" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="44" y="97" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400E">Doc 1</text>
  <!-- sinistre -->
  <rect x="78" y="75" width="87" height="37" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="121" y="97" text-anchor="middle" font-size="11" fill="#92400E">0,42</text>
  <!-- chat -->
  <rect x="165" y="75" width="87" height="37" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="208" y="97" text-anchor="middle" font-size="11" fill="#92400E">0,87</text>
  <!-- provision — INTERSECTION -->
  <rect x="252" y="75" width="87" height="37" fill="#C7D2FE" stroke="#818CF8" stroke-width="2"/>
  <text x="295" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730A3">0,31</text>
  <!-- IBNR — zero -->
  <rect x="339" y="75" width="87" height="37" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="382" y="97" text-anchor="middle" font-size="11" fill="#D1D5DB">0</text>
  <!-- dots -->
  <rect x="426" y="75" width="46" height="37" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="449" y="97" text-anchor="middle" font-size="11" fill="#9CA3AF">···</text>

  <!-- ROW 1: Doc 2 -->
  <rect x="10" y="112" width="68" height="37" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="44" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="#6B7280">Doc 2</text>
  <rect x="78" y="112" width="87" height="37" fill="white" stroke="#E5E7EB"/>
  <text x="121" y="134" text-anchor="middle" font-size="11" fill="#374151">0,38</text>
  <rect x="165" y="112" width="87" height="37" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="208" y="134" text-anchor="middle" font-size="11" fill="#D1D5DB">0</text>
  <!-- provision — colonne surlignée -->
  <rect x="252" y="112" width="87" height="37" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="295" y="134" text-anchor="middle" font-size="11" fill="#1E40AF">0,45</text>
  <rect x="339" y="112" width="87" height="37" fill="white" stroke="#E5E7EB"/>
  <text x="382" y="134" text-anchor="middle" font-size="11" fill="#374151">0,62</text>
  <rect x="426" y="112" width="46" height="37" fill="white" stroke="#E5E7EB"/>
  <text x="449" y="134" text-anchor="middle" font-size="11" fill="#9CA3AF">···</text>

  <!-- ROW 2: Doc 3 -->
  <rect x="10" y="149" width="68" height="37" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="44" y="171" text-anchor="middle" font-size="9" font-weight="bold" fill="#6B7280">Doc 3</text>
  <rect x="78" y="149" width="87" height="37" fill="white" stroke="#E5E7EB"/>
  <text x="121" y="171" text-anchor="middle" font-size="11" fill="#374151">0,71</text>
  <rect x="165" y="149" width="87" height="37" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="208" y="171" text-anchor="middle" font-size="11" fill="#D1D5DB">0</text>
  <!-- provision — colonne surlignée -->
  <rect x="252" y="149" width="87" height="37" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="295" y="171" text-anchor="middle" font-size="11" fill="#1E40AF">0,28</text>
  <rect x="339" y="149" width="87" height="37" fill="white" stroke="#E5E7EB"/>
  <text x="382" y="171" text-anchor="middle" font-size="11" fill="#374151">0,55</text>
  <rect x="426" y="149" width="46" height="37" fill="white" stroke="#E5E7EB"/>
  <text x="449" y="171" text-anchor="middle" font-size="11" fill="#9CA3AF">···</text>

  <!-- Annotation ligne (vecteur) — à droite de Doc 1 -->
  <line x1="478" y1="93" x2="490" y2="93" stroke="#92400E" stroke-width="1.5" marker-end="url(#arr_v)"/>
  <text x="493" y="88" font-size="9" font-weight="bold" fill="#92400E">un vecteur</text>
  <text x="493" y="100" font-size="9" fill="#92400E">= une ligne</text>

  <!-- Annotation bas : 80 000 colonnes -->
  <line x1="10" y1="200" x2="77" y2="200" stroke="#6B7280" stroke-width="1" marker-start="url(#arr_l)" marker-end="url(#arr_r)"/>
  <line x1="79" y1="200" x2="471" y2="200" stroke="#6B7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="472" y1="200" x2="471" y2="200" stroke="#6B7280" stroke-width="1"/>
  <text x="255" y="215" text-anchor="middle" font-size="9" fill="#6B7280">80 000 colonnes au total = 80 000 dimensions</text>

  <!-- Légende intersection -->
  <rect x="10" y="222" width="10" height="10" rx="2" fill="#C7D2FE" stroke="#818CF8"/>
  <text x="24" y="231" font-size="9" fill="#374151">intersection : valeur du Doc 1 sur la dimension « provision »</text>
</svg>
