<svg viewBox="0 0 560 222" xmlns="http://www.w3.org/2000/svg" width="560" height="222" font-family="-apple-system,BlinkMacSystemFont,sans-serif">
  <rect width="560" height="222" rx="8" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="280" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Divergence BERT / GPT à partir du Transformer (2018)</text>
  <!-- Transformer box -->
  <rect x="190" y="28" width="180" height="40" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="280" y="44" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#5B21B6">Transformer</text>
  <text x="280" y="59" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#7C3AED">Vaswani et al., 2017</text>
  <!-- Fork lines -->
  <line x1="280" y1="68" x2="140" y2="95" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="280" y1="68" x2="420" y2="95" stroke="#9CA3AF" stroke-width="1.5"/>
  <!-- BERT box -->
  <rect x="45" y="95" width="190" height="42" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="140" y="112" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#1E40AF">BERT — encodeur seul</text>
  <text x="140" y="128" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#3B82F6">bidirectionnel · masked LM</text>
  <!-- GPT box -->
  <rect x="325" y="95" width="190" height="42" rx="6" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/>
  <text x="420" y="112" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#92400E">GPT — décodeur seul</text>
  <text x="420" y="128" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#D97706">autoregressif · next-token</text>
  <!-- Connector lines down -->
  <line x1="140" y1="137" x2="140" y2="155" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="420" y1="137" x2="420" y2="155" stroke="#D97706" stroke-width="1.5"/>
  <!-- Descendants boxes -->
  <rect x="40" y="155" width="200" height="32" rx="5" fill="white" stroke="#BFDBFE"/>
  <text x="140" y="168" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#374151">Sentence-Transformers</text>
  <text x="140" y="181" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#6B7280">E5, CamemBERT, BGE-M3</text>
  <rect x="320" y="155" width="200" height="32" rx="5" fill="white" stroke="#FDE68A"/>
  <text x="420" y="168" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#374151">GPT-4, Claude, Llama 3</text>
  <text x="420" y="181" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#6B7280">Mistral, Gemma, Phi-3</text>
  <!-- Connector lines to use-case labels -->
  <line x1="140" y1="187" x2="140" y2="200" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="420" y1="187" x2="420" y2="200" stroke="#D97706" stroke-width="1.5"/>
  <!-- Use-case labels -->
  <rect x="40" y="200" width="200" height="18" rx="4" fill="#DBEAFE"/>
  <text x="140" y="212" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1E40AF" font-weight="bold">→ Embeddings RAG</text>
  <rect x="320" y="200" width="200" height="18" rx="4" fill="#FEF3C7"/>
  <text x="420" y="212" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#92400E" font-weight="bold">→ Génération RAG</text>
</svg>
